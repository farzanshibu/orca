name: Team office Windows exe

# Throwaway: builds an unsigned Windows installer of this branch as a downloadable artifact.
on:
  push:
    branches: [ci/team-office-win-exe]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      ORCA_WIN_ADHOC: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Version
        shell: bash
        run: echo "ORCA_ADHOC_BUILD_VERSION=$(node -p 'require("./package.json").version')-adhoc.$(date -u +%Y%m%d%H%M%S)" >>"$GITHUB_ENV"

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build Windows process-table addon for the relay
        shell: bash
        run: |
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=x64
          node config/scripts/build-windows-process-tree-relay-addon.mjs --arch=arm64

      - name: Build app
        shell: bash
        run: pnpm build:release
        env:
          ORCA_REQUIRE_RELAY_NATIVE_ADDONS: 'x64,arm64'

      - name: Package installer
        run: node config/scripts/ensure-native-runtime.mjs --runtime=electron; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; pnpm exec electron-builder --config config/electron-builder.config.cjs --win --publish never
        env:
          ORCA_BUILD_COMMIT: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: orca-windows-setup
          path: dist/*.exe
          if-no-files-found: error
